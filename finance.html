<style>
:root{
  --navy:#0F1820; --sage:#8FAF8F; --mint:#C5DDD0; --cream:#F8F6F2;
  --line:#E4E0D8; --muted:#7A8087; --danger:#C0574E; --ok:#5E8C61;
  --warn:#D9A441; --gold:#B08D57;
  --r:16px; --sh:0 1px 3px rgba(15,24,32,.07), 0 10px 30px rgba(15,24,32,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',-apple-system,sans-serif;background:var(--cream);
  color:var(--navy);font-size:15px;line-height:1.55;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

.btn{background:var(--navy);color:#fff;padding:12px 20px;border-radius:var(--r);
  font-weight:600;white-space:nowrap;transition:opacity .15s}
.btn:active{opacity:.75}
.btn:disabled{opacity:.4}
.btn-2{background:var(--sage)}
.btn-gold{background:var(--gold)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn-danger{background:var(--danger)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn-full{width:100%}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;
  border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sage)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip.ok{background:#E4F0E6;color:var(--ok)}
.chip.bad{background:#F7E9E8;color:var(--danger)}
.chip.warn{background:#FBF0DA;color:#8A6510}

.toast{position:fixed;bottom:88px;inset-inline:16px;z-index:9999;background:var(--navy);
  color:#fff;padding:14px 18px;border-radius:var(--r);text-align:center;font-weight:500;
  box-shadow:var(--sh);animation:up .25s}
.toast.err{background:var(--danger)} .toast.ok{background:var(--ok)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,var(--navy),#1c2b36)}
#login .box{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:34px 26px}
#login .brand{display:block;width:100%;max-width:200px;margin:0 auto 10px}
#login .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;font-weight:600}

#app{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:78px}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
header .who{font-weight:600}
header .role{font-size:12px;opacity:.6}
header button{color:#fff;background:rgba(255,255,255,.14);padding:7px 13px;
  border-radius:10px;font-size:13px;font-weight:600}
main{flex:1;padding:16px;max-width:1150px;width:100%;margin:0 auto}

nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--navy)}
.badge{position:absolute;top:3px;inset-inline-end:16px;background:var(--danger);color:#fff;
  min-width:19px;height:19px;border-radius:99px;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px}

.page-title{font-size:19px;font-weight:700;margin-bottom:14px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:14px;flex-wrap:wrap}

/* بطاقات كبيرة */
.big{background:var(--navy);color:#fff;border-radius:22px;padding:24px 22px;
  box-shadow:var(--sh);margin-bottom:12px}
.big .lbl{font-size:13px;opacity:.6;margin-bottom:6px}
.big .val{font-size:38px;font-weight:700;line-height:1.12}
.big .sub{font-size:12.5px;opacity:.6;margin-top:6px}
.big.neg .val{color:#F0A8A0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.tile{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:var(--sh)}
.tile .lbl{font-size:12.5px;color:var(--muted);margin-bottom:5px}
.tile .val{font-size:24px;font-weight:700}
.tile .val.up{color:var(--ok)} .tile .val.dn{color:var(--danger)}
.tile .sub{font-size:11.5px;color:var(--muted);margin-top:3px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px;margin-bottom:18px}
.stat{background:#fff;border-radius:var(--r);padding:15px;box-shadow:var(--sh)}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.stat .val{font-size:20px;font-weight:700}
.stat .val.up{color:var(--ok)} .stat .val.dn{color:var(--danger)}

.list{display:flex;flex-direction:column;gap:9px}
.item{background:#fff;border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.item .nm{font-weight:600}
.item .meta{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--ok)} .amt.out{color:var(--danger)}

.acct{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:10px;
  border-inline-start:5px solid var(--sage)}
.acct .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acct .bal{font-size:26px;font-weight:700;margin-top:6px}

.overlay{position:fixed;inset:0;background:rgba(15,24,32,.45);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--cream);width:100%;max-width:520px;border-radius:24px 24px 0 0;
  padding:22px;max-height:92dvh;overflow-y:auto;animation:up .25s}
.sheet h3{font-size:18px;margin-bottom:16px}
.sheet-actions{display:flex;gap:9px;margin-top:18px}
.sheet-actions .btn{flex:1}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88dvh}}

.pay-row{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.pay-row:last-child{border-bottom:none}
.pay-row .lb{color:var(--muted)}

.kinds{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kind-btn{background:#fff;border-radius:var(--r);padding:15px 10px;box-shadow:var(--sh);
  font-weight:600;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:5px}
.kind-btn .ic{font-size:19px}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
.menu-card{background:#fff;border-radius:var(--r);padding:20px 14px;box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;
  text-align:center;position:relative}
.menu-card svg{width:25px;height:25px;stroke:var(--navy);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px}
.tabs button{padding:8px 15px;border-radius:99px;background:#fff;border:1.5px solid var(--line);
  font-size:13px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--sage)}

.gauge{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--sh);margin-bottom:11px}
.gauge .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gauge .t{font-weight:600}
.gauge .v{font-size:24px;font-weight:700}
.gauge .d{font-size:12.5px;color:var(--muted);margin-top:6px}
.gauge.g{border-inline-start:5px solid var(--ok)}
.gauge.y{border-inline-start:5px solid var(--warn)}
.gauge.r{border-inline-start:5px solid var(--danger)}

.alert{background:#FBF0DA;border-radius:var(--r);padding:13px 15px;margin-bottom:9px;
  border-inline-start:4px solid var(--warn);font-size:13.5px}
.alert.red{background:#F7E9E8;border-color:var(--danger)}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--navy);
  border-radius:50%;animation:sp .7s linear infinite;margin:44px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  header,nav,.no-print{display:none!important}
  body{background:#fff} #app{padding:0}
  .card,.item,.tile,.stat,.acct,.gauge{box-shadow:none;border:1px solid var(--line)}
}
</style>

function toast(m,k){$$('.toast').forEach(e=>e.remove());
  const d=document.createElement('div');d.className='toast'+(k?' '+k:'');d.textContent=m;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function sheet(h){const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="sheet">${h}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});
  document.body.appendChild(o);return o}
const closeSheet=()=>$$('.overlay').forEach(e=>e.remove());

function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('#lgSub').textContent=t('signin'); $('#lbEmail').textContent=t('email');
  $('#lbPass').textContent=t('pass');  $('#btnLogin').textContent=t('login');
  $('#btnLang').textContent=lang==='ar'?'English':'عربي';
  $('#btnLang2').textContent=lang==='ar'?'EN':'ع';
  $('#btnOut').textContent=t('logout'); $('#hRole').textContent=t('sys');
  if(S.me){buildNav();render()}
}
$('#btnLang').onclick=$('#btnLang2').onclick=()=>{
  lang=lang==='ar'?'en':'ar';store.setItem('flang',lang);applyLang()};

$('#btnLogin').onclick=async()=>{
  const b=$('#btnLogin');b.disabled=true;
  const{error}=await sb.auth.signInWithPassword({
    email:$('#email').value.trim(),password:$('#pass').value});
  b.disabled=false;
  if(error){toast(t('errLogin'),'err');return}
  boot();
};
$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#btnLogin').click()});
$('#btnOut').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function boot(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}
  const{data:me}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!me||me.role!=='owner'){toast(t('noAccess'),'err');await sb.auth.signOut();
    setTimeout(()=>location.reload(),1800);return}
  S.me=me;
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#hName').textContent=lang==='ar'?me.full_name_ar:(me.full_name_en||me.full_name_ar);
  await loadRefs(); await countAlerts();
  buildNav(); render();
}

async function loadRefs(){
  const[a,c,p,s,e]=await Promise.all([
    sb.rpc('fin_balances'),
    sb.from('fin_categories').select('*').eq('is_active',true).order('sort_order'),
    sb.from('fin_partners').select('*').eq('is_active',true).order('name_ar'),
    sb.from('fin_suppliers').select('*').eq('is_active',true).order('name'),
    sb.from('fin_employees').select('*').eq('is_active',true).order('name'),
  ]);
  S.accs=a.data||[]; S.cats=c.data||[]; S.parts=p.data||[];
  S.sups=s.data||[]; S.emps=e.data||[];
}

async function countAlerts(){
  try{
    const soon=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
    const{count}=await sb.from('fin_debts').select('id',{count:'exact',head:true})
      .eq('is_settled',false).eq('direction','payable').lte('due_date',soon);
    S.alerts=count||0;
    const{data:low}=await sb.from('fin_products').select('id,qty,min_qty').eq('is_active',true);
    S.alerts += (low||[]).filter(p=>+p.qty<=+p.min_qty && +p.min_qty>0).length;
  }catch(e){S.alerts=0}
}

function buildNav(){
  const tabs=[['home','nHome','home'],['moves','nMoves','mov'],['accounts','nAcc','acc'],
              ['debts','nDebt','debt',S.alerts],['more','nMore','more']];
  const grp={suppliers:'more',employees:'more',stock:'more',health:'more',fixed:'more',
             reports:'more',partners:'more',cats:'more',statement:'accounts'};
  const cur=grp[S.tab]||S.tab;
  $('#nav').innerHTML=tabs.map(([id,l,i,n])=>`
    <button data-t="${id}" class="${cur===id?'on':''}">
      ${n?`<span class="badge">${n}</span>`:''}
      <svg viewBox="0 0 24 24">${IC[i]}</svg>${t(l)}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>{
    S.tab=b.dataset.t;buildNav();render();window.scrollTo(0,0)});
}
function go(x){S.tab=x;buildNav();render();window.scrollTo(0,0)}
function back(title,to){return `<div class="row-between">
  <div class="page-title" style="margin:0">${title}</div>
  <button class="btn-sm btn-ghost no-print" onclick="go('${to}')">${lang==='ar'?'رجوع ›':'‹ Back'}</button></div>`}

function render(){
  $('#view').innerHTML='<div class="spin"></div>';
  ({home:vHome,moves:vMoves,accounts:vAccounts,debts:vDebts,more:vMore,
    suppliers:vSuppliers,employees:vEmployees,stock:vStock,health:vHealth,fixed:vFixed,
    reports:vReports,partners:vPartners,cats:vCats,statement:vStatement}[S.tab]||vHome)();
}

<script>
/* ══════════ الرئيسية ══════════ */
async function vHome(){
  const monthStart=S.ym+'-01', monthLast=lastDayOfMonth(S.ym);
  const[{data:sum},{data:last},{data:fixed},{data:fixedPaid},{data:salaryPaid}]=await Promise.all([
    sb.rpc('fin_summary',{p_ym:S.ym}),
    sb.from('fin_entries').select('*,fin_categories(name_ar,name_en),fin_partners(name_ar,name_en),fin_accounts!fin_entries_account_id_fkey(name_ar,name_en)')
      .order('entry_date',{ascending:false}).order('created_at',{ascending:false}).limit(8),
    sb.from('fin_recurring_expenses').select('*').eq('is_active',true).eq('frequency','monthly').order('due_day'),
    sb.from('fin_recurring_payments').select('recurring_id,amount_fils').gte('pay_date',monthStart).lte('pay_date',monthLast),
    sb.from('fin_entries').select('employee_id,amount_fils').eq('kind','expense').not('employee_id','is',null)
      .gte('entry_date',monthStart).lte('entry_date',monthLast),
  ]);
  const s=(sum||[])[0]||{};
  const pf=+(s.profit_fils||0);
  const fpaid={};(fixedPaid||[]).forEach(p=>fpaid[p.recurring_id]=(fpaid[p.recurring_id]||0)+(+p.amount_fils||0));
  const fixedDue=(fixed||[]).reduce((z,x)=>z+(+x.amount_fils||0),0);
  const fixedDone=Object.values(fpaid).reduce((a,b)=>a+b,0);
  const salaryDone={};(salaryPaid||[]).forEach(p=>salaryDone[p.employee_id]=(salaryDone[p.employee_id]||0)+(+p.amount_fils||0));
  const salaryDue=S.emps.reduce((z,e)=>z+(+e.salary_fils||0),0);
  const salaryPaidTotal=Object.values(salaryDone).reduce((a,b)=>a+b,0);
  const commitmentDue=fixedDue+salaryDue;
  const commitmentPaid=Math.min(fixedDone,fixedDue)+Math.min(salaryPaidTotal,salaryDue);
  const commitmentRem=Math.max(0,commitmentDue-commitmentPaid);
  const afterCommit=(+s.total_fils||0)-commitmentRem;

  $('#view').innerHTML=`
    <div class="field no-print"><input type="month" id="ym" value="${S.ym}"></div>
    <div class="big">
      <div class="lbl">${t('totalBal')}</div>
      <div class="val num">${money(s.total_fils||0)}</div>
      <div class="sub">${t('kwd')}</div>
    </div>
    <div class="grid2">
      <div class="tile"><div class="lbl">${t('bank')}</div>
        <div class="val num">${money(s.bank_fils||0)}</div></div>
      <div class="tile"><div class="lbl">${t('cash')}</div>
        <div class="val num">${money(s.cash_fils||0)}</div></div>
      <div class="tile"><div class="lbl">${t('monthIncome')}</div>
        <div class="val up num">${money(s.income_fils||0)}</div></div>
      <div class="tile"><div class="lbl">${t('monthExpense')}</div>
        <div class="val dn num">${money(s.expense_fils||0)}</div></div>
    </div>

    <div class="card" style="margin-bottom:14px;cursor:pointer" onclick="go('fixed')">
      <div class="row-between"><b>${t('monthlyCommitments')}</b><span>›</span></div>
      <div class="stats" style="margin-top:10px">
        <div class="stat"><div class="lbl">${t('total')}</div><div class="val num">${money(commitmentDue)}</div></div>
        <div class="stat"><div class="lbl">${t('remainingThisMonth')}</div><div class="val dn num">${money(commitmentRem)}</div></div>
      </div>
    </div>
    <div class="big ${afterCommit<0?'neg':''}" style="background:${afterCommit<0?'#3A2422':'#24342B'}">
      <div class="lbl">${t('availableAfterCommitments')}</div>
      <div class="val num">${money(afterCommit)}</div>
      <div class="sub">${S.ym}</div>
    </div>

    <div class="big ${pf<0?'neg':''}" style="background:${pf<0?'#3A2422':'#1E3326'}">
      <div class="lbl">${pf<0?t('loss'):t('profit')}</div>
      <div class="val num">${money(Math.abs(pf))}</div>
      <div class="sub">${S.ym}</div>
    </div>
    ${(+s.due_soon_fils>0)?`<div class="alert" onclick="go('debts')">
      ⏰ ${t('dueSoon')}: <b>${money(s.due_soon_fils)}</b> ${t('kwd')}</div>`:''}
    <div class="stats">
      <div class="stat"><div class="lbl">${t('totalOwed')}</div>
        <div class="val up num">${money(s.receivable_fils||0)}</div></div>
      <div class="stat"><div class="lbl">${t('totalDue')}</div>
        <div class="val dn num">${money(s.payable_fils||0)}</div></div>
    </div>

    <div class="kinds no-print" style="margin-bottom:18px">
      <button class="kind-btn" data-k="income"><span class="ic">＋</span>${t('income')}</button>
      <button class="kind-btn" data-k="expense"><span class="ic">－</span>${t('expense')}</button>
      <button class="kind-btn" data-k="transfer"><span class="ic">⇄</span>${t('transfer')}</button>
      <button class="kind-btn" data-k="withdrawal"><span class="ic">↓</span>${t('withdrawal')}</button>
    </div>

    <div class="row-between"><div class="page-title" style="margin:0">${t('latest')}</div>
      <button class="btn-sm btn-ghost no-print" onclick="go('moves')">${t('all')} ›</button></div>
    ${rowsHtml(last||[])}`;

  $('#ym').onchange=e=>{S.ym=e.target.value;render()};
  $$('.kind-btn').forEach(b=>b.onclick=()=>entryForm(b.dataset.k));
  bindRows(last||[]);
}

function kindLabel(e){
  if(e.kind==='income'||e.kind==='expense')
    return e.fin_categories?nm(e.fin_categories):t(e.kind);
  if(e.kind==='transfer') return t('transfer');
  return `${t(e.kind)} · ${e.fin_partners?nm(e.fin_partners):''}`;
}
function rowsHtml(rows){
  if(!rows.length) return `<div class="empty">${t('noMoves')}</div>`;
  return `<div class="list">${rows.map(e=>{
    const inn=e.kind==='income'||e.kind==='capital';
    const tr=e.kind==='transfer';
    return `<div class="item" data-e="${e.id}"><div style="min-width:0">
      <div class="nm">${esc(kindLabel(e))}</div>
      <div class="meta">${e.entry_date}${e.fin_accounts?' · '+esc(nm(e.fin_accounts)):''}${e.note?' · '+esc(e.note):''}</div>
    </div><div class="amt num ${tr?'':(inn?'in':'out')}">${tr?'⇄':(inn?'+':'−')} ${money(e.amount_fils)}</div></div>`;
  }).join('')}</div>`;
}
function bindRows(rows){
  $$('.item[data-e]').forEach(el=>el.onclick=()=>entryDetail(rows.find(r=>r.id===el.dataset.e)));
}

/* ══════════ نموذج الحركة ══════════ */
function entryForm(kind,ex){
  const isCat=kind==='income'||kind==='expense';
  const isPart=kind==='capital'||kind==='withdrawal';
  const isTr=kind==='transfer';
  const cats=S.cats.filter(c=>c.kind===kind);
  const accOpts=(sel)=>S.accs.map(a=>`<option value="${a.account_id}" ${sel===a.account_id?'selected':''}>${esc(nm(a))}</option>`).join('');

  const o=sheet(`
    <h3>${t(kind)}</h3>
    <div class="field"><label>${t('amount')} (${t('kwd')}) *</label>
      <input type="number" id="eA" step="0.001" min="0" inputmode="decimal"
        value="${ex?(ex.amount_fils/1000):''}"></div>
    <div class="f2">
      <div class="field"><label>${t('date')}</label>
        <input type="date" id="eD" value="${ex?ex.entry_date:today()}"></div>
      <div class="field"><label>${isTr?t('from'):t('account')} *</label>
        <select id="eAcc">${accOpts(ex?ex.account_id:null)}</select></div>
    </div>
    ${isTr?`<div class="field"><label>${t('to')} *</label>
      <select id="eAcc2">${accOpts(ex?ex.to_account_id:null)}</select></div>`:''}
    ${isCat?`<div class="field"><label>${t('category')} *</label>
      <select id="eC"><option value="">${t('pick')}</option>
        ${cats.map(c=>`<option value="${c.id}" ${ex&&ex.category_id===c.id?'selected':''}>${esc(nm(c))}</option>`).join('')}
      </select></div>`:''}
    ${isPart?`<div class="field"><label>${t('partner')} *</label>
      <select id="eP"><option value="">${t('pick')}</option>
        ${S.parts.map(p=>`<option value="${p.id}" ${ex&&ex.partner_id===p.id?'selected':''}>${esc(nm(p))}</option>`).join('')}
      </select></div>`:''}
    ${kind==='expense'?`<div class="field"><label>${t('supplier')}</label>
      <select id="eS"><option value="">—</option>
        ${S.sups.map(s=>`<option value="${s.id}" ${ex&&ex.supplier_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
      </select></div>`:''}
    <div class="f2">
      <div class="field"><label>${t('method')}</label>
        <select id="eM"><option value="cash">${t('cashM')}</option>
          <option value="knet">${t('knet')}</option><option value="bank">${t('bankM')}</option>
          <option value="other">${t('other')}</option></select></div>
      <div class="field"><label>${t('ref')}</label>
        <input id="eR" value="${ex?esc(ex.ref||''):''}"></div>
    </div>
    <div class="field"><label>${t('note')}</label>
      <textarea id="eN" rows="2">${ex?esc(ex.note||''):''}</textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">${t('cancel')}</button>
      <button class="btn" id="eOk">${t('save')}</button></div>`);

  if(ex) o.querySelector('#eM').value=ex.method||'cash';

  $('#view').innerHTML=`

      `<div class="alert red">⚠ ${t('overdue')}: ${esc(d.person)} — ${money(d.amount_fils-d.paid_fils)}</div>`).join('')}

        <div style="min-width:0"><div class="nm">${esc(d.person)}</div>
          <div class="meta">${d.due_date?(t('dueDate')+' '+d.due_date):d.debt_date}${d.note?' · '+esc(d.note):''}</div></div>

async function vFixed(){
  const monthStart=S.ym+'-01', monthLast=lastDayOfMonth(S.ym);
  const[{data:rows,error:e1},{data:pays,error:e2}]=await Promise.all([
    sb.from('fin_recurring_expenses').select('*').eq('is_active',true).eq('frequency','monthly').order('due_day'),
    sb.from('fin_recurring_payments').select('*').gte('pay_date',monthStart).lte('pay_date',monthLast)
  ]);
  if(e1||e2){toast((e1||e2).message,'err');return}
  const paid={};(pays||[]).forEach(p=>paid[p.recurring_id]=(paid[p.recurring_id]||0)+(+p.amount_fils||0));
  const total=(rows||[]).reduce((s,r)=>s+(+r.amount_fils||0),0);
  const paidTotal=(rows||[]).reduce((s,r)=>s+Math.min(+r.amount_fils||0,paid[r.id]||0),0);
  const rem=Math.max(0,total-paidTotal);
  $('#view').innerHTML=`
    ${back(t('fixed'),'more')}
    <div class="field no-print"><input type="month" id="ym" value="${S.ym}"></div>
    <div class="stats">
      <div class="stat"><div class="lbl">${t('total')}</div><div class="val num">${money(total)}</div></div>
      <div class="stat"><div class="lbl">${t('paidThisMonth')}</div><div class="val up num">${money(paidTotal)}</div></div>
      <div class="stat"><div class="lbl">${t('remainingThisMonth')}</div><div class="val dn num">${money(rem)}</div></div>
    </div>
    <button class="btn btn-full no-print" style="margin-bottom:14px" id="fxAdd">+ ${t('newFixed')}</button>
    ${(rows||[]).length?`<div class="list">${rows.map(r=>{
      const p=paid[r.id]||0, rr=Math.max(0,(+r.amount_fils||0)-p), full=rr===0;
      return `<div class="item" data-fx="${r.id}">
        <div><div class="nm">${esc(r.name)}</div>
          <div class="meta">${t('dueDay')}: ${r.due_day||1} · ${t('paidThisMonth')}: ${money(p)}</div></div>
        <div style="text-align:end">
          <div class="amt num">${money(r.amount_fils)}</div>
          <div class="meta">${t('remaining')}: ${money(rr)}</div>
          <button class="btn-sm ${full?'btn-ghost':'btn-2'} no-print" data-fxpay="${r.id}" ${full?'disabled':''}>${full?t('fullyPaid'):t('payNow')}</button>
        </div></div>`}).join('')}</div>`:`<div class="empty">${t('noMoves')}</div>`}`;
  $('#ym').onchange=e=>{S.ym=e.target.value;render()};
  $('#fxAdd').onclick=()=>fixedForm();
  $$('.item[data-fx]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-fxpay]'))return;
    fixedForm((rows||[]).find(x=>x.id===el.dataset.fx));
  });
  $$('[data-fxpay]').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const r=(rows||[]).find(x=>x.id===btn.dataset.fx);
    payFixed(r,paid[r.id]||0);
  });
}

                   :await sb.from('fin_employees').insert(body);
    if(error){toast(error.message,'err');return}
    closeSheet();toast(t('saved'),'ok');await loadRefs();render()};
  if(o.querySelector('#mDel'))o.querySelector('#mDel').onclick=async()=>{
    if(!confirm(t('delQ')))return;
    await sb.from('fin_employees').update({is_active:false}).eq('id',ex.id);
    closeSheet();await loadRefs();render()};
}

/* ══════════ المخزون ══════════ */
async function vStock(){
  const{data:ps}=await sb.from('fin_products').select('*').eq('is_active',true).order('name');
  const val=(ps||[]).reduce((s,p)=>s+ +p.qty*+p.cost_fils,0);
  const low=(ps||[]).filter(p=>+p.qty<=+p.min_qty&&+p.min_qty>0);
  $('#view').innerHTML=`
    ${back(t('stock'),'more')}
    <div class="grid2">
      <div class="tile"><div class="lbl">${t('stockValue')}</div>
        <div class="val num">${money(val)}</div></div>
      <div class="tile"><div class="lbl">${t('lowStock')}</div>
        <div class="val ${low.length?'dn':''}">${low.length}</div></div>
    </div>
    ${low.map(p=>`<div class="alert">⚠ ${esc(p.name)} — ${t('qty')}: ${+p.qty}</div>`).join('')}
    <button class="btn btn-full no-print" style="margin-bottom:14px" id="pAdd">+ ${t('newProduct')}</button>
    ${(ps||[]).length?`<div class="list">${ps.map(p=>`
      <div class="item" data-p="${p.id}"><div><div class="nm">${esc(p.name)}</div>
        <div class="meta">${esc(p.sku||'')} · ${t('cost')} ${money(p.cost_fils)}</div></div>
      <div style="text-align:end"><div class="amt num">${+p.qty} ${esc(p.unit||'')}</div>
        ${+p.qty<=+p.min_qty&&+p.min_qty>0?`<span class="chip bad">${t('lowStock')}</span>`:''}</div>
      </div>`).join('')}</div>`:`<div class="empty">${t('noProducts')}</div>`}`;
  $('#pAdd').onclick=()=>prodForm();
  $$('.item[data-p]').forEach(el=>el.onclick=()=>prodDetail((ps||[]).find(x=>x.id===el.dataset.p)));
}

function prodForm(ex){
  const o=sheet(`<h3>${ex?t('edit'):t('newProduct')}</h3>
    <div class="field"><label>${t('product')} *</label>
      <input id="pN" value="${ex?esc(ex.name):''}"></div>
    <div class="f2">
      <div class="field"><label>${t('sku')}</label><input id="pS" value="${ex?esc(ex.sku||''):''}"></div>
      <div class="field"><label>${t('unit')}</label><input id="pU" value="${ex?esc(ex.unit||'قطعة'):'قطعة'}"></div>
    </div>
    <div class="f2">
      <div class="field"><label>${t('cost')} (${t('kwd')})</label>
        <input type="number" id="pC" step="0.001" value="${ex?(ex.cost_fils/1000):''}" inputmode="decimal"></div>
      <div class="field"><label>${t('price')} (${t('kwd')})</label>
        <input type="number" id="pP" step="0.001" value="${ex?(ex.price_fils/1000):''}" inputmode="decimal"></div>
    </div>
    <div class="field"><label>${t('minQty')}</label>
      <input type="number" id="pM" step="1" value="${ex?+ex.min_qty:0}"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()">${t('cancel')}</button>
      <button class="btn" id="pOk">${t('save')}</button></div>`);
  o.querySelector('#pOk').onclick=async()=>{
    const n=o.querySelector('#pN').value.trim();
    if(!n){toast(t('required'),'err');return}
    const body={name:n,sku:o.querySelector('#pS').value.trim()||null,
      unit:o.querySelector('#pU').value.trim()||'قطعة',
      cost_fils:Math.round((+o.querySelector('#pC').value||0)*1000),
      price_fils:Math.round((+o.querySelector('#pP').value||0)*1000),
      min_qty:+o.querySelector('#pM').value||0};
    const{error}=ex?await sb.from('fin_products').update(body).eq('id',ex.id)
                   :await sb.from('fin_products').insert(body);
    if(error){toast(error.message,'err');return}
    closeSheet();toast(t('saved'),'ok');await countAlerts();buildNav();render()};
}

async function prodDetail(p){
  const{data:mv}=await sb.from('fin_stock_moves').select('*')
    .eq('product_id',p.id).order('move_date',{ascending:false}).limit(30);
  const o=sheet(`<h3>${esc(p.name)}</h3>
    <div class="card" style="margin-bottom:12px">
      <div class="pay-row"><span class="lb">${t('qty')}</span>
        <b style="font-size:19px">${+p.qty} ${esc(p.unit||'')}</b></div>
      <div class="pay-row"><span class="lb">${t('cost')}</span><b class="num">${money(p.cost_fils)}</b></div>
      <div class="pay-row"><span class="lb">${t('price')}</span><b class="num">${money(p.price_fils)}</b></div>
      <div class="pay-row"><span class="lb">${t('minQty')}</span><b>${+p.min_qty}</b></div>
    </div>
    <div style="display:flex;gap:9px;margin-bottom:12px">
      <button class="btn btn-2" style="flex:1" data-m="in">＋ ${t('stockIn')}</button>
      <button class="btn btn-ghost" style="flex:1" data-m="out">－ ${t('stockOut')}</button></div>
    <div style="font-weight:600;margin-bottom:8px">${t('moves')}</div>
    ${(mv||[]).length?`<div class="list">${mv.map(m=>`
      <div class="item"><div><div class="nm">${m.move_date}</div>
        <div class="meta">${esc(m.note||'')}</div></div>
      <b class="${m.direction==='in'?'amt in':'amt out'}">${m.direction==='in'?'+':'−'} ${+m.qty}</b></div>`).join('')}</div>`
     :`<div class="empty" style="padding:16px">—</div>`}
    <button class="btn btn-ghost btn-full" style="margin-top:12px" id="pE">${t('edit')}</button>
    <button class="btn-sm btn-ghost btn-full" style="margin-top:9px"
      onclick="closeSheet()">${t('close')}</button>`);
  o.querySelector('#pE').onclick=()=>{closeSheet();prodForm(p)};
  o.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const dir=b.dataset.m;
    closeSheet();
    const o2=sheet(`<h3>${t(dir==='in'?'stockIn':'stockOut')} — ${esc(p.name)}</h3>
      <div class="field"><label>${t('qty')} *</label>
        <input type="number" id="qN" step="1" min="1" inputmode="numeric"></div>
      <div class="field"><label>${t('date')}</label><input type="date" id="qD" value="${today()}"></div>
      <div class="field"><label>${t('note')}</label><input id="qT"></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" onclick="closeSheet()">${t('cancel')}</button>
        <button class="btn" id="qOk">${t('save')}</button></div>`);
    o2.querySelector('#qOk').onclick=async()=>{
      const q=+o2.querySelector('#qN').value||0;
      if(!q){toast(t('required'),'err');return}
      const{error}=await sb.from('fin_stock_moves').insert({product_id:p.id,direction:dir,qty:q,
        move_date:o2.querySelector('#qD').value,
        note:o2.querySelector('#qT').value.trim()||null,created_by:S.me.id});
      if(error){toast(error.message,'err');return}
      closeSheet();toast(t('saved'),'ok');await countAlerts();buildNav();render()};
  });
}

/* ══════════ الشريكات ══════════ */

    ${back(t('partners'),'more')}

        <button class="btn" id="pOk">${t('save')}</button></div>`);

    ${back(t('categories'),'more')}
    <button class="btn btn-full no-print" style="margin-bottom:14px" id="cAdd">+ ${t('newCat')}</button>

/* ══════════ التقارير ══════════ */
async function vReports(){
  const yr=S.ym.slice(0,4);
  const{data:rows}=await sb.from('fin_entries')
    .select('entry_date,kind,amount_fils,category_id')
    .gte('entry_date',yr+'-01-01').lte('entry_date',yr+'-12-31');
  const M={},C={};
  (rows||[]).forEach(e=>{
    const m=e.entry_date.slice(0,7);M[m]||={i:0,x:0};
    if(e.kind==='income')M[m].i+=e.amount_fils;
    if(e.kind==='expense'){M[m].x+=e.amount_fils;
      C[e.category_id]=(C[e.category_id]||0)+e.amount_fils}
  });
  const ms=Object.keys(M).sort();
  const ti=ms.reduce((s,m)=>s+M[m].i,0), tx=ms.reduce((s,m)=>s+M[m].x,0);
  const cl=Object.entries(C).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...Object.values(C));

  $('#view').innerHTML=`
    ${back(t('reports')+' — '+yr,'more')}
    <div class="field no-print"><input type="month" id="ym" value="${S.ym}"></div>
    <div style="display:flex;gap:9px;margin-bottom:16px" class="no-print">
      <button class="btn btn-2 btn-sm" style="flex:1" id="xl">${t('exportX')}</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="window.print()">${t('exportP')}</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="lbl">${t('income')}</div>
        <div class="val up num">${money(ti)}</div></div>
      <div class="stat"><div class="lbl">${t('expense')}</div>
        <div class="val dn num">${money(tx)}</div></div>
      <div class="stat"><div class="lbl">${t('net')}</div>
        <div class="val ${ti-tx<0?'dn':'up'} num">${money(ti-tx)}</div></div>
      <div class="stat"><div class="lbl">${t('avgMonth')}</div>
        <div class="val num">${money(ms.length?(ti-tx)/ms.length:0)}</div></div>
    </div>
    <div class="page-title" style="font-size:16px">${t('monthly')}</div>
    <div class="list" style="margin-bottom:22px">${ms.map(m=>{
      const p=M[m].i-M[m].x;
      return `<div class="item"><div><div class="nm">${m}</div>
        <div class="meta num">${money(M[m].i)} − ${money(M[m].x)}</div></div>
      <div class="amt num ${p<0?'out':'in'}">${money(p)}</div></div>`}).join('')}</div>
    <div class="page-title" style="font-size:16px">${t('byCategory')}</div>
    ${cl.length?`<div class="list">${cl.map(([id,v])=>{
      const c=S.cats.find(x=>x.id===id);
      return `<div class="item" style="display:block">
        <div class="row-between" style="margin:0">
          <span class="nm">${esc(c?nm(c):'—')}</span>
          <span class="amt out num">${money(v)}</span></div>
        <div class="bar"><i style="width:${Math.round(v/mx*100)}%"></i></div></div>`}).join('')}</div>`
     :`<div class="empty">${t('noMoves')}</div>`}`;

  $('#ym').onchange=e=>{S.ym=e.target.value;render()};
  $('#xl').onclick=()=>{
    const s1=ms.map(m=>({[t('month')]:m,[t('income')]:M[m].i/1000,
      [t('expense')]:M[m].x/1000,[t('net')]:(M[m].i-M[m].x)/1000}));
    const s2=cl.map(([id,v])=>{const c=S.cats.find(x=>x.id===id);
      return{[t('category')]:c?nm(c):'—',[t('amount')]:v/1000}});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s1),'Monthly');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s2),'Categories');
    XLSX.writeFile(wb,`report_${yr}.xlsx`);
  };
}

function exportXlsx(data,name){
  if(!data.length){toast(t('noMoves'),'err');return}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Data');
  XLSX.writeFile(wb,name+'.xlsx');
}
